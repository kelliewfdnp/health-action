   <div><h3 class="text-lg font-bold text-slate-900" x-text="t(D.hierarchy.title)"></h3><p class="text-sm text-slate-500" x-text="t(D.hierarchy.sub)"></p></div>
   <div class="space-y-3">
    <template x-for="(l,i) in D.hierarchy.levels"><div>
     <div class="rounded-2xl p-5 border" :class="'bg-'+l.tone+'-50 border-'+l.tone+'-200'">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-2"><span class="px-3 py-1 text-white text-xs font-bold rounded-full uppercase" :class="l.tone==='slate'?'bg-slate-700':'bg-'+l.tone+'-600'" x-text="l.label"></span><span class="text-xs font-semibold" :class="'text-'+(l.tagTone||l.tone)+'-700'" x-text="l.tag"></span></div>
      <h4 class="font-bold text-slate-900 text-base" x-text="t(l.title)"></h4>
      <p class="text-sm text-slate-600 mt-1 leading-relaxed" x-text="t(l.text)"></p>
     </div>
     <div class="flex justify-center py-3 text-slate-400" x-show="i<D.hierarchy.levels.length-1"><i class="fa-solid fa-arrow-down"></i></div>
    </div></template>
   </div>
  </div>
 </div>

 <!-- TAB 4 -->
 <div x-show="tab==='labs'" x-transition>
  <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
   <div><h3 class="text-lg font-bold text-slate-900" x-text="t(D.labs.title)"></h3><p class="text-sm text-slate-500" x-text="t(D.labs.sub)"></p></div>
   <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
    <template x-for="m in D.labs.markers"><div class="rounded-2xl p-5 border border-slate-200 bg-white hover:shadow-md transition">
     <div class="flex items-start justify-between gap-2"><div><h4 class="font-bold text-slate-900 text-base" x-text="m.name"></h4><span class="text-xs text-slate-500" x-text="m.sub"></span></div>
      <span class="text-xs font-bold px-2 py-0.5 rounded whitespace-nowrap" :class="'bg-'+m.tone+'-100 text-'+m.tone+'-700'" x-text="m.badge"></span></div>
     <div class="h-2.5 bg-slate-200 rounded-full overflow-hidden mt-4 mb-3"><div class="h-full rounded-full" :class="'bg-'+m.tone+'-500'" :style="'width:'+m.pct+'%'"></div></div>
     <p class="text-sm text-slate-600 leading-relaxed"><b x-text="mode==='e'?'Simple: ':'Practitioner: '"></b><span x-text="t(m.text)"></span></p>
    </div></template>
   </div>
  </div>
 </div>

 <!-- TAB 5 -->
 <div x-show="tab==='safety'" x-transition>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
   <div class="lg:col-span-2 bg-white rounded-2xl p-6 border border-rose-200 shadow-sm space-y-4">
    <div class="flex items-center gap-3 pb-4 border-b border-slate-100"><i class="fa-solid fa-triangle-exclamation text-2xl text-rose-600"></i><div><h3 class="text-lg font-bold text-slate-900" x-text="t(D.safety.flagsTitle)"></h3><p class="text-sm text-slate-500" x-text="D.safety.flagsSub"></p></div></div>
    <template x-for="f in D.safety.flags"><div class="flex gap-3 items-start bg-rose-50 border border-rose-200 rounded-xl p-4"><i :class="'fa-solid fa-'+f.icon+' text-rose-600 mt-1'"></i><div><h4 class="font-bold text-base text-rose-900" x-text="t(f.title)"></h4><p class="text-sm text-rose-800 mt-0.5 leading-relaxed" x-text="t(f.text)"></p></div></div></template>
   </div>
   <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
    <div class="flex items-center gap-3 pb-4 border-b border-slate-100"><i class="fa-solid fa-vial-circle-check text-2xl text-teal-600"></i><div><h3 class="text-lg font-bold text-slate-900" x-text="D.safety.testsTitle"></h3><p class="text-sm text-slate-500" x-text="D.safety.testsSub"></p></div></div>
    <template x-for="s in D.safety.tests"><div class="rounded-xl p-4 border" :class="s.priority?'bg-amber-50 border-2 border-amber-400':'bg-slate-50 border-slate-200'">
     <span x-show="s.priority" class="inline-flex items-center gap-1 px-2.5 py-0.5 bg-amber-400 text-amber-950 text-xs font-bold rounded-full uppercase mb-2"><i class="fa-solid fa-star"></i><span x-text="s.priority"></span></span>
     <h4 class="font-bold text-base text-slate-900" x-text="s.title"></h4><p class="text-sm text-slate-600 mt-1 leading-relaxed" x-text="t(s.text)"></p>
    </div></template>
   </div>
  </div>
 </div>

</main>

<footer class="bg-white border-t border-slate-200 mt-6 py-6 px-4 text-center"><p class="text-xs text-slate-500" x-text="D.footer"></p></footer>

<script>
function dash(){return{
 D:CLIENT,mode:'e',tab:'ecosystem',node:0,
 t(v){return (v&&typeof v==='object'&&!Array.isArray(v)&&('e' in v))?v[this.mode]:v},
 doneCount(){return this.D.plan.p1.items.filter(i=>i.done).length},
 progress(){const a=this.D.plan.p1.items;return a.length?Math.round(a.filter(i=>i.done).length/a.length*100):0},
 async init(){const h=document.querySelector('header'),sp=document.getElementById('hdr-spacer'),fit=()=>{sp.style.height=h.offsetHeight+'px'};fit();new ResizeObserver(fit).observe(h);window.addEventListener('resize',fit);
  const u=new URLSearchParams(location.search).get('data');
  if(u){try{this.D=await (await fetch(u)).json()}catch(e){console.warn('Could not load',u,e)}}}
}}
</script>
</body>
</html>
