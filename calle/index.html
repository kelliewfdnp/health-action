  headline:T('“Your body is like a busy city stuck in a 20–30 year traffic jam — the gut, the liver and the power plant all need clearing and refuelling.”','Gut–Immune Load Driving Hepatic Congestion, a B2 Energy Bottleneck & Thyroid-Axis Slowdown'),

  nodes:[
   {icon:'shield-virus',tone:'rose',status:'Red Flag',statusTone:'rose',name:T('1. The Gut & Immune Front Door','Gut / Mucosal & Microbial Load'),desc:T('Your gut lining and its bugs are on high alert, which keeps your immune system busy.','Mucosal immune activation, dysbiosis and mold/fungal metabolite load.'),marker:'sIgA (3793)',

   <div><h4 class="font-bold text-amber-900 text-base" x-text="t(D.plan.rule.title)"></h4><p class="text-sm text-amber-800 mt-1 leading-relaxed" x-text="t(D.plan.rule.text)"></p></div>
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
   <div class="lg:col-span-2 bg-white rounded-2xl p-6 border-2 border-emerald-500 shadow-sm space-y-5">
    <div class="flex flex-wrap items-center justify-between gap-2 pb-4 border-b border-slate-100">
     <div class="flex flex-wrap items-center gap-3"><span class="px-3 py-1 bg-emerald-600 text-white text-xs font-bold rounded-full uppercase" x-text="D.plan.p1.badge"></span><h3 class="text-lg font-bold text-slate-900" x-text="t(D.plan.p1.title)"></h3></div>
     <span class="text-xs font-semibold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-lg" x-text="D.plan.p1.tag"></span>
    </div>
    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider" x-text="D.plan.p1.list"></h4>
    <div class="space-y-3">
     <template x-for="(it,i) in D.plan.p1.items"><div><h5 x-show="it.group && (i===0 || D.plan.p1.items[i-1].group!==it.group)" class="text-xs font-bold text-slate-500 uppercase tracking-wider mt-2 mb-2" x-text="it.group"></h5><label class="flex gap-3 items-start p-4 rounded-xl border border-slate-200 bg-slate-50/60 hover:bg-slate-50 cursor-pointer transition">
      <input type="checkbox" x-model="it.done" class="mt-1 h-5 w-5 rounded border-slate-300 text-teal-600 focus:ring-teal-500">
      <div class="flex-1"><div class="flex flex-wrap items-center justify-between gap-2"><span class="font-semibold text-slate-900 text-base" x-text="it.name"></span><span class="text-xs font-semibold px-2.5 py-0.5 rounded" :class="'bg-'+it.tagTone+'-100 text-'+it.tagTone+'-800'" x-text="it.tag"></span></div>
      <p class="text-sm text-slate-600 mt-1 leading-relaxed" x-text="t(it.text)"></p>
      <a x-show="it.url" :href="it.url" target="_blank" rel="noopener" @click.stop class="inline-flex items-center gap-1 mt-2 text-xs font-semibold text-teal-700 hover:text-teal-900 underline-offset-2 hover:underline">View on iHerb <i class="fa-solid fa-arrow-right"></i></a></div>
     </label></div></template>
    </div>
    <div class="pt-3">
     <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1.5"><span>Daily Compliance Progress:</span><span class="text-emerald-700" x-text="progress()+'% Completed'"></span></div>
     <div class="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-emerald-500 rounded-full transition-all duration-500" :style="'width:'+progress()+'%'"></div></div>
    </div>
   </div>
   <div class="bg-slate-100/70 rounded-2xl p-6 border border-slate-200 space-y-4">
    <div class="flex flex-wrap items-start justify-between gap-2 pb-4 border-b border-slate-200">
     <div class="flex items-start gap-3"><span class="px-3 py-1 bg-slate-500 text-white text-xs font-bold rounded-full uppercase mt-0.5" x-text="D.plan.p2.badge"></span><h3 class="text-lg font-bold text-slate-800 leading-tight" x-text="t(D.plan.p2.title)"></h3></div>
     <span class="text-xs font-semibold text-slate-600 bg-slate-200 px-3 py-1 rounded-lg" x-text="D.plan.p2.tag"></span>
    </div>
    <p class="text-sm text-slate-600 leading-relaxed" x-text="t(D.plan.p2.intro)"></p>
    <div class="space-y-2.5">
     <template x-for="it in D.plan.p2.items"><div class="flex gap-3 items-center bg-white p-3.5 rounded-xl border border-slate-200"><i :class="'fa-solid fa-'+it.icon+' text-lg text-'+it.tone+'-500'"></i><div><div class="font-semibold text-base text-slate-800" x-text="it.name"></div><div class="text-sm text-slate-500" x-text="it.text"></div></div></div></template>
    </div>
    <div class="bg-amber-50 border border-amber-200 text-amber-900 text-sm rounded-xl p-3.5 flex gap-2 items-start"><i class="fa-solid fa-lock mt-0.5"></i><span><b>Phase 2 Locked:</b> <span x-text="D.plan.p2.lock"></span></span></div>
   </div>
  </div>
 </div>

 <!-- TAB 3 -->
 <div x-show="tab==='hierarchy'" x-transition>
  <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
   <div><h3 class="text-lg font-bold text-slate-900" x-text="t(D.hierarchy.title)"></h3><p class="text-sm text-slate-500" x-text="t(D.hierarchy.sub)"></p></div>
   <div class="space-y-3">
    <template x-for="(l,i) in D.hierarchy.levels"><div>
     <div class="rounded-2xl p-5 border" :class="'bg-'+l.tone+'-50 border-'+l.tone+'-200'">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-2"><span class="px-3 py-1 text-white text-xs font-bold rounded-full uppercase" :class="l.tone==='slate'?'bg-slate-700':'bg-'+l.tone+'-600'" x-text="l.label"></span><span class="text-xs font-semibold" :class="'text-'+(l.tagTone||l.tone)+'-700'" x-text="l.tag"></span></div>
      <h4 class="font-bold text-slate-900 text-base" x-text="t(l.title)"></h4>
      <p class="text-sm text-slate-600 mt-1 leading-relaxed" x-text="t(l.text)"></p>
     </div>
     <div class="flex justify-center py-3 text-slate-400" x-show="i<D.hierarchy.levels.length-1"><i class="fa-solid fa-arrow-down"></i></div>
    </div></template>
   </div>
  </div>
 </div>

 <!-- TAB 4 -->
 <div x-show="tab==='labs'" x-transition>
  <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
   <div><h3 class="text-lg font-bold text-slate-900" x-text="t(D.labs.title)"></h3><p class="text-sm text-slate-500" x-text="t(D.labs.sub)"></p></div>
   <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
    <template x-for="m in D.labs.markers"><div class="rounded-2xl p-5 border border-slate-200 bg-white hover:shadow-md transition">
     <div class="flex items-start justify-between gap-2"><div><h4 class="font-bold text-slate-900 text-base" x-text="m.name"></h4><span class="text-xs text-slate-500" x-text="m.sub"></span></div>
      <span class="text-xs font-bold px-2 py-0.5 rounded whitespace-nowrap" :class="'bg-'+m.tone+'-100 text-'+m.tone+'-700'" x-text="m.badge"></span></div>
     <div class="h-2.5 bg-slate-200 rounded-full overflow-hidden mt-4 mb-3"><div class="h-full rounded-full" :class="'bg-'+m.tone+'-500'" :style="'width:'+m.pct+'%'"></div></div>
     <p class="text-sm text-slate-600 leading-relaxed"><b x-text="mode==='e'?'Simple: ':'Practitioner: '"></b><span x-text="t(m.text)"></span></p>
    </div></template>
   </div>
  </div>
 </div>

 <!-- TAB 5 -->
 <div x-show="tab==='safety'" x-transition>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
   <div class="lg:col-span-2 bg-white rounded-2xl p-6 border border-rose-200 shadow-sm space-y-4">
    <div class="flex items-center gap-3 pb-4 border-b border-slate-100"><i class="fa-solid fa-triangle-exclamation text-2xl text-rose-600"></i><div><h3 class="text-lg font-bold text-slate-900" x-text="t(D.safety.flagsTitle)"></h3><p class="text-sm text-slate-500" x-text="D.safety.flagsSub"></p></div></div>
    <template x-for="f in D.safety.flags"><div class="flex gap-3 items-start bg-rose-50 border border-rose-200 rounded-xl p-4"><i :class="'fa-solid fa-'+f.icon+' text-rose-600 mt-1'"></i><div><h4 class="font-bold text-base text-rose-900" x-text="t(f.title)"></h4><p class="text-sm text-rose-800 mt-0.5 leading-relaxed" x-text="t(f.text)"></p></div></div></template>
   </div>
   <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
    <div class="flex items-center gap-3 pb-4 border-b border-slate-100"><i class="fa-solid fa-vial-circle-check text-2xl text-teal-600"></i><div><h3 class="text-lg font-bold text-slate-900" x-text="D.safety.testsTitle"></h3><p class="text-sm text-slate-500" x-text="D.safety.testsSub"></p></div></div>
    <template x-for="s in D.safety.tests"><div class="rounded-xl p-4 border" :class="s.priority?'bg-amber-50 border-2 border-amber-400':'bg-slate-50 border-slate-200'">
     <span x-show="s.priority" class="inline-flex items-center gap-1 px-2.5 py-0.5 bg-amber-400 text-amber-950 text-xs font-bold rounded-full uppercase mb-2"><i class="fa-solid fa-star"></i><span x-text="s.priority"></span></span>
     <h4 class="font-bold text-base text-slate-900" x-text="s.title"></h4><p class="text-sm text-slate-600 mt-1 leading-relaxed" x-text="t(s.text)"></p>
    </div></template>
   </div>
  </div>
 </div>

</main>

<footer class="bg-white border-t border-slate-200 mt-6 py-6 px-4 text-center"><p class="text-xs text-slate-500" x-text="D.footer"></p></footer>

<script>
function dash(){return{
 D:CLIENT,mode:'e',tab:'ecosystem',node:0,
 t(v){return (v&&typeof v==='object'&&!Array.isArray(v)&&('e' in v))?v[this.mode]:v},
 doneCount(){return this.D.plan.p1.items.filter(i=>i.done).length},
 progress(){const a=this.D.plan.p1.items;return a.length?Math.round(a.filter(i=>i.done).length/a.length*100):0},
 async init(){const h=document.querySelector('header'),sp=document.getElementById('hdr-spacer'),fit=()=>{sp.style.height=h.offsetHeight+'px'};fit();new ResizeObserver(fit).observe(h);window.addEventListener('resize',fit);
  const u=new URLSearchParams(location.search).get('data');
  if(u){try{this.D=await (await fetch(u)).json()}catch(e){console.warn('Could not load',u,e)}}}
}}
</script>
